name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run formatting checks
        run: uv run ruff format --check .

      - name: Run type checks
        run: uv run mypy src tests

      - name: Exercise command-line interface
        run: uv run ecodeling --version

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install browser audit dependencies
        run: npm ci

      - name: Run browser audit unit tests
        run: npm test

      - name: Check public web component
        run: |
          npm run typecheck:web
          npm run lint:web
          npm run format:check
          npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser audit smoke test
        run: npm run test:browser
